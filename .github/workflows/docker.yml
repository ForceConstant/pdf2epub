name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (e.g. 0.2.2 or 0.2.2-rc.1)"
        required: true
        type: string

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            dockerfile: Dockerfile
            suffix: ""
          - variant: nvidia
            dockerfile: Dockerfile.nvidia
            suffix: "-nvidia"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version and lowercase image name
        id: image
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          IMAGE_SUFFIX: ${{ matrix.suffix }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version="$MANUAL_VERSION"
          fi
          python - "$version" <<'PY'
          import re, sys
          number = r'(?:0|[1-9][0-9]*)'
          identifier = rf'(?:{number}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver = rf'{number}\.{number}\.{number}(?:-{identifier}(?:\.{identifier})*)?'
          if not re.fullmatch(semver, sys.argv[1]):
              sys.exit('Expected strict semver, e.g. 0.2.2 or 0.2.2-rc.1')
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.image.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && !contains(steps.image.outputs.version, '-') }}

      # CUDA wheels are large. Reclaim unused hosted-runner SDKs before building.
      - name: Make room for NVIDIA runtime
        if: matrix.variant == 'nvidia'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: docker/setup-buildx-action@v3

      - name: Build locally for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify image before publishing
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -m pip check
          docker run --rm --user 1000:1000 --env HOME=/tmp --env TORCH_DEVICE=cpu --entrypoint python \
            "$IMAGE" /app/main.py --help
          docker run --rm --user 1000:1000 --env HOME=/tmp --env TORCH_DEVICE=cpu --entrypoint python \
            "$IMAGE" /usr/local/bin/check-tuning.py
          docker run --rm --user 1000:1000 --env HOME=/tmp --env TORCH_DEVICE=cpu --entrypoint python \
            "$IMAGE" /usr/local/bin/check-offload.py
          if [[ "$VARIANT" == nvidia ]]; then
            docker run --rm --entrypoint python "$IMAGE" /usr/local/bin/check-cuda-build.py
            docker run --rm --user 1000:1000 --env HOME=/tmp --env TORCH_DEVICE=cpu --entrypoint python \
              "$IMAGE" -c 'import torch, torchvision; from marker.converters.pdf import PdfConverter; assert torch.version.cuda == "12.6", torch.version.cuda; print(torch.__version__, torchvision.__version__, torch.version.cuda)'
            # Assert opt-in behavior: the NVIDIA entrypoint rejects missing GPUs.
            if docker run --rm --user 1000:1000 --env HOME=/tmp "$IMAGE" --help >gpu-check.log 2>&1; then
              echo '::error::NVIDIA entrypoint unexpectedly accepted a run without GPUs'
              exit 1
            fi
            cat gpu-check.log
            grep -Fq 'NVIDIA GPU unavailable' gpu-check.log
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Build summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Published image tags'
            echo '```text'
            echo "$IMAGE_TAGS"
            echo '```'
            echo 'Dependency consistency and CLI startup passed before publication.'
            echo 'Lazy offload, tensor and cache checks passed using real Surya classes and tiny CPU models.'
            echo 'NVIDIA checks verify CUDA wheels and rejection without a GPU, not real GPU conversion.'
            echo 'A new GHCR package may require its owner to enable public visibility; verify anonymous pullability.'
          } >> "$GITHUB_STEP_SUMMARY"
