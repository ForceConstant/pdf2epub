name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify image before publishing
        env:
          IMAGE: ghcr.io/forceconstant/pdf2epub:${{ steps.meta.outputs.version }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -m pip check
          docker run --rm --entrypoint python "$IMAGE" /app/main.py --help
          docker run --rm --entrypoint python \
            --env PYTHONPATH=/app \
            --env PDF2EPUB_VLM=1 --env PDF2EPUB_VLM_API_KEY=workflow-check \
            "$IMAGE" -c 'import pypdfium2; from modules.vlm import read_vlm_config; assert read_vlm_config()["model"] == "deepseek/deepseek-v4.1-flash"'
          docker run --rm --entrypoint python --env PYTHONPATH=/app \
            --volume "$PWD/tests:/tests:ro" \
            "$IMAGE" /tests/test_epub_navigation.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run hosted-VLM unit tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_vlm.py -q

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
